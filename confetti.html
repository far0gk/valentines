<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Card</title>
    <style>
        body {
            background-color: pink;
            color: red;
            text-align: center;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 3em;
            margin-top: 20%;
        }
        p {
            font-size: 1.5em;
            color: white;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: red;
            opacity: 0.7;
            animation: confetti-fall 3s linear infinite;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }
    </style>
</head>
<body>
</body>
</html>
    <h1>YAYY! THANK YOU FOR BEING MY BEAUTIFUL WIFE/VALENTINE. I LOVE YOU SO MUCH!</h1>

        <!-- <p>I hope you enjoy the Starbucks and pretty flowers</p> -->

        <script>
            function createConfetti() {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = ['red', 'white', 'pink'][Math.floor(Math.random() * 3)];
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }

            for (let i = 0; i < 100; i++) {
                setTimeout(createConfetti, i * 100);
            }
        </script>
    </body>
    </html>
