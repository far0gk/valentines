<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Hearts Background</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ff0000;
            transform: rotate(-45deg);
            animation: animate 3s infinite;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ff0000;
            border-radius: 50%;
        }

        .heart::before {
            top: -15px;
            left: 0;
        }

        .heart::after {
            left: 15px;
            top: 0;
        }

        @keyframes animate {
            0% {
                transform: scale(0) rotate(-45deg);
                opacity: 1;
            }
            100% {
                transform: scale(1.5) rotate(-45deg);
                opacity: 0;
            }
        }

        .vbox {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            z-index: 10;
            max-width: 90%;
            width: 300px;
        }

        .vbox button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            display: block;
            width: 100px;
            margin-left: auto;
            margin-right: auto;
        }

        .yes {
            background: white;
            border: 2px solid red;
            border-radius: 10px;
        }

        .no {
            background: black;
            color: white;
            border: 2px solid black;
            border-radius: 10px;
            position: absolute;
        }

        .no::before {
            content: "😢";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="heart-container"></div>
    <div class="vbox">
        <h1>Will you be my Valentine?</h1>
        <button class="yes" onclick="showConfetti()">Yes</button>
        <button class="no" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
    </div>

    <script>
        const heartContainer = document.querySelector('.heart-container');
        const numHearts = 20;

        for (let i = 0; i < numHearts; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = `${Math.random() * 100}%`;
            heart.style.top = `${Math.random() * 100}%`;
            heart.style.animationDelay = `${Math.random() * 3}s`;
            heartContainer.appendChild(heart);
        }

        function showConfetti() {
            window.location.href = './confetti.html';
        }

        let noButtonClicks = 0;

        function moveNoButton() {
            const noButton = document.querySelector('.no');
            const yesButton = document.querySelector('.yes');
            const vbox = document.querySelector('.vbox');

            noButtonClicks++;

            if (noButtonClicks >= 15 ) {
                noButton.style.display = 'none';
                yesButton.style.position = 'static';
                yesButton.style.display = 'block';
                yesButton.style.margin = '10px auto';
            } else {
                const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
                const y = Math.random() * (window.innerHeight - noButton.offsetHeight);
                noButton.style.left = `${x}px`;
                noButton.style.top = `${y}px`;
            }
        }
    </script>
</body>
</html>
